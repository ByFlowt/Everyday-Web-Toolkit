<!DOCTYPE html>
<html lang="de" data-page="protected">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1416">
    <title>KI Konverter | Material 3</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/converter.css">
    <script src="assets/js/session.js"></script>
    <script src="assets/js/session-guard.js"></script>
    <script type="module" src="assets/js/converter.js"></script>
</head>

<body>
    <noscript>
        <p>Diese Seite benötigt JavaScript. Bitte aktiviere es, um den Konverter zu nutzen.</p>
    </noscript>

    <header class="top-app-bar">
        <a class="icon-btn" href="index.html" aria-label="Zurück zum Dashboard" title="Zurück zum Dashboard">
            <span class="material-symbols-outlined" aria-hidden="true" translate="no">arrow_back</span>
        </a>
        <h1 class="title">Text Konverter</h1>
        <button type="button" class="btn btn--tonal" data-logout>
            <span class="material-symbols-outlined" aria-hidden="true" translate="no">logout</span>
            <span class="btn-label">Logout</span>
        </button>
    </header>

    <main class="page">
        <section class="card">
            <div class="key-row">
                <div class="field">
                    <label for="apiKey">Google Gemini API-Key</label>
                    <!-- Not a password field: managers would fill the login password here or overwrite the login entry.
                        Disabled until secret-field.js has made sure the value is masked. -->
                    <input type="text" id="apiKey" class="secret-input" placeholder="Key aus Google AI Studio"
                        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore
                        data-lpignore="true" data-bwignore aria-describedby="keyHint" disabled>
                </div>
                <button type="button" id="toggleKey" class="btn btn--tonal" aria-pressed="false"
                    aria-controls="apiKey" aria-label="API-Key anzeigen">Anzeigen</button>
            </div>
            <p id="keyHint" class="supporting">Beschränke den Key in Google Cloud bzw. AI Studio auf die Gemini API
                und auf den HTTP-Referrer dieser Website. Dein Text wird zur Verarbeitung an Google gesendet.</p>
            <div class="switch-row">
                <label for="rememberKey">Auf diesem Gerät merken</label>
                <input type="checkbox" role="switch" id="rememberKey" class="switch" autocomplete="off">
            </div>
            <button type="button" id="deleteKey" class="btn">
                <span class="material-symbols-outlined" aria-hidden="true" translate="no">delete</span>
                Key löschen
            </button>
        </section>

        <section class="card">
            <div class="field field--supported">
                <label for="inputText">Gib deinen Text ein</label>
                <textarea id="inputText" maxlength="4000" autocomplete="off" aria-describedby="charCount"
                    placeholder="z.B. 'Ich mache heute früher Feierabend'"></textarea>
            </div>
            <p id="charCount" class="supporting counter">0 / 4000 Zeichen</p>

            <fieldset id="modePicker">
                <legend>Stil</legend>
                <div class="connected">
                    <input type="radio" class="sr-only" name="mode" id="modeRoyal" value="royal" checked>
                    <label for="modeRoyal">Höfisch</label>
                    <input type="radio" class="sr-only" name="mode" id="modeYouth" value="youth">
                    <label for="modeYouth">Gen-Z</label>
                    <input type="radio" class="sr-only" name="mode" id="modeLinkedin" value="linkedin">
                    <label for="modeLinkedin">LinkedIn</label>
                </div>
            </fieldset>

            <button type="button" id="convertButton" class="btn btn--filled btn--m btn--block">
                <span class="material-symbols-outlined" aria-hidden="true" translate="no">auto_awesome</span>
                Umwandeln
            </button>

            <div class="progress">
                <span id="loadingIndicator" class="loading-indicator" aria-hidden="true" hidden></span>
                <p id="status" role="status"></p>
                <button type="button" id="cancelButton" class="btn btn--outlined" hidden>Abbrechen</button>
            </div>
            <p id="error" class="message message--error" role="alert"></p>

            <div aria-live="polite">
                <div id="output" class="result"></div>
            </div>
            <div class="result-actions">
                <button type="button" id="copyButton" class="btn btn--tonal" hidden>
                    <span class="material-symbols-outlined" aria-hidden="true" translate="no">content_copy</span>
                    <span id="copyLabel">Kopieren</span>
                </button>
            </div>
        </section>
    </main>
</body>

</html>
